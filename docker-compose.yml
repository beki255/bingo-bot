services:
  postgres:
    image: postgres:16-alpine
    container_name: bingo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo_dev_pass
      POSTGRES_DB: bingo_db
    ports:
      - "5432:5432"
    volumes:
      - bingo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bingo_pgdata:

